# ===================================================================
# Retail Store Billing Application - Backend Configuration
# ===================================================================

server.port=8080

# Database Configuration (supports env variables with sensible local defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:retail_billing_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Store / Receipt metadata (Configurable for demonstration)
store.name=${STORE_NAME:SuperMart Retail Store}
store.address=${STORE_ADDRESS:Shop 12, Main Market Road, Bangalore, Karnataka - 560001}
store.phone=${STORE_PHONE:+91 98765 43210}
store.gstin=${STORE_GSTIN:29AAAAA0000A1Z5}
store.tax-mode=${STORE_TAX_MODE:INTRA_STATE}

# CORS - allowed origins for local Vite frontend and optional Vercel deployment
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Logging
logging.level.com.retailbilling=INFO
logging.level.org.springframework.jdbc=INFO
